<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nybble</title>
<meta name="description" content="Nybble — personalized models that are pleasant to work and interact with.">
<style>
  :root { --bg: #ffffff; --fg: #000000; --muted: #6b6b6b; --accent: #7ccf8a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 20px/1.5 Georgia, "Times New Roman", Times, serif;
    display: grid; place-items: center; padding: 16px; text-align: center;
  }
  main { max-width: 48rem; }
  h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: normal; letter-spacing: -0.02em; margin: 0 0 0.5rem; color: var(--accent); }
  p { margin: 0; color: var(--fg); }
  footer { margin-top: 3rem; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Nybble</h1>
  <p>Personalized models that are pleasant to work and interact with</p>
  <footer>&copy; 2026 Nybble</footer>
</main>
</body>
</html>

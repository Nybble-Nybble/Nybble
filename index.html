<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nybble</title>
<meta name="description" content="Nybble — a personal model that learns you. Coming soon.">
<style>
  :root { --bg: #0b0b0d; --fg: #f2f2f0; --muted: #8a8a90; --accent: #9be7a3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 16px; text-align: center;
  }
  main { max-width: 34rem; }
  h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: -0.03em; margin: 0 0 0.5rem; }
  h1 span { color: var(--accent); }
  p { margin: 0 0 1.25rem; color: var(--muted); }
  .tag {
    display: inline-block; border: 1px solid #2a2a2e; border-radius: 999px;
    padding: 0.35rem 0.9rem; font-size: 0.85rem; color: var(--fg);
  }
  footer { margin-top: 3rem; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Nybble<span>.</span></h1>
  <p>A personalized model that learns from your data and keeps learning as you use it.<br>Your model. Your style. Always up to date.</p>
  <span class="tag">Coming soon</span>
  <footer>&copy; 2026 Nybble</footer>
</main>
</body>
</html>

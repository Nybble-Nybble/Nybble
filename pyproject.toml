[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nybble"
version = "0.2.0"
description = "Gemini-labeled egocentric action prediction with PowerNap and Tinker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai==2.17.0",
    "openai==2.53.0",
    "pillow==12.3.0",
]

[project.optional-dependencies]
local = ["mlx-vlm==0.6.8"]
tinker = [
    "tinker==0.25.0",
    "tinker-cookbook[inkling]==0.5.3",
    "tml-renderers==0.1.0",
    "torch==2.13.0",
]
screen = ["napsack==0.1.3"]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
nybble = "nybble.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_gemini: requires GEMINI_API_KEY and makes a paid API request",
    "live_tinker: requires TINKER_API_KEY and makes paid remote training requests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
